<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contextro FA</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">پروژه NLP فارسی</span><h1>Contextro <strong>FA</strong></h1><p>کلمه مخفی را با نزدیک‌شدن معنایی پیدا کن.</p><div class="stats"><div><b id="attempts">0</b><span>تلاش</span></div><div><b id="best">0.0</b><span>بهترین</span></div><div><b id="streak">0</b><span>Streak</span></div><div><b id="gameScore">0</b><span>Score</span></div></div></section><section class="panel"><form id="guessForm"><input id="guessInput" autocomplete="off" placeholder="مثلاً: دریا، دانشگاه، پزشک..."><button>حدس بزن</button></form><div class="actions"><button id="hintBtn" type="button">💡 راهنمایی</button><button id="giveUpBtn" type="button">🏳️ تسلیم</button><button id="nextBtn" type="button" hidden>⏭ کلمه بعدی</button></div><div id="hintBox" class="hint" hidden></div><div id="message" class="message"></div><div class="legend"><span>❄️ دور</span><span>🔥 نزدیک</span><span>🏆 جواب</span></div><div id="guesses" class="guesses"></div></section><section id="journeySection" class="panel"><h2>Semantic Journey</h2><div id="journey" class="journey"></div></section><section id="neighborsSection" class="panel" hidden><h2>نزدیک‌ترین کلمات معنایی</h2><div id="neighbors" class="neighbors"></div></section><section class="panel"><h2>🧠 AI Lab</h2><div id="lab" class="lab"></div></section></main><script src="/app.js"></script></body></html>
